<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account – La Extravaganza</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/main.css" />
    <script src="../js/header.js"></script>
    <script src="../js/footer.js"></script>
    <script src="../js/register.js"></script>
</head>
<body>
    <header class="sticky top-0 z-20" id="header"></header>

    <main class="px-6 py-16">
        <div class="card" style="max-width:440px; margin:0 auto; padding:44px 48px;">

            <p class=" kicker mb-2">Create Account</p>
            <h1 class="font-serif text-4xl mb-8" style="color:#2C241B;">
                Begin your stay.
            </h1>

            <div class="error-msg" id="errorMsg"></div>
            <div class="success-msg" id="successMsg"></div>

            <div class="mb-7">
                <label class="input-label">Full Name</label>
                <input type="text" id="fullName" class="input-line" />
            </div>

            <div class="mb-7">
                <label class="input-label">Email</label>
                <input type="email" id="email" class="input-line" />
            </div>

            <div class="mb-7">
                <label class="input-label">Password</label>
                <input type="password" id="password" class="input-line" />
            </div>

            <div class="mb-10">
                <label class="input-label">Confirm Password</label>
                <input type="password" id="confirmPassword" class="input-line" />
            </div>

            <button class="btn-primary w-full mb-5" onclick="handleRegister()">
                Create Account
            </button>

            <p class="text-xs text-center" style="color:#8B7355;">
                Already a member?
                <a href="./Login.html" style="color:#4A3B32; text-decoration:underline; text-underline-offset:2px;">
                    Sign in
                </a>
            </p>
        </div>
    </main>

    <footer id="footer"></footer>
</body>
</html>
