<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account – La Extravaganza</title>
    <link rel="stylesheet" href="../css/main.css" />

    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml" />

    <meta name="description" content="Create a La Extravaganza account to book and manage your stays." />

    <script src="../js/ui.js"></script>
    <script src="../js/header.js"></script>
    <script src="../js/footer.js"></script>
    <script src="../js/register.js"></script>
    <!-- Built by npm run build:css; last in <head> to keep the same cascade as the old Tailwind CDN -->
    <link rel="stylesheet" href="/css/tailwind.css" />
</head>
<body>
    <header class="sticky top-0 z-20" id="header"></header>

    <main class="px-4 py-16">
        <div class="card" style="max-width:460px; margin:0 auto; padding:44px clamp(24px, 6vw, 48px);">

            <p class="kicker mb-2">Create account</p>
            <h1 class="font-serif text-4xl mb-2" style="color:#2C241B;">Begin your stay.</h1>
            <p class="text-sm mb-8" style="color:var(--lux-text-muted)">An account keeps your bookings in one place and lets you review your stays.</p>

            <form id="register-form" novalidate>
                <div class="error-msg" id="errorMsg" role="alert"></div>

                <div class="mb-7">
                    <label class="input-label" for="fullName">Full name</label>
                    <input type="text" id="fullName" class="input-line" autocomplete="name" aria-describedby="fullName-error" />
                    <p class="field-error mt-2" id="fullName-error"></p>
                </div>

                <div class="mb-7">
                    <label class="input-label" for="email">Email</label>
                    <input type="email" id="email" class="input-line" autocomplete="email" aria-describedby="email-error" />
                    <p class="field-error mt-2" id="email-error"></p>
                </div>

                <div class="mb-7">
                    <label class="input-label" for="password">Password</label>
                    <div class="password-wrap">
                        <input type="password" id="password" class="input-line" autocomplete="new-password" aria-describedby="strength-text password-error" />
                    </div>
                    <div class="strength" id="strength" data-level="0" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
                    <p class="field-hint mt-2" id="strength-text">At least 8 characters.</p>
                    <p class="field-error mt-1" id="password-error"></p>
                </div>

                <div class="mb-10">
                    <label class="input-label" for="confirmPassword">Confirm password</label>
                    <div class="password-wrap">
                        <input type="password" id="confirmPassword" class="input-line" autocomplete="new-password" aria-describedby="confirmPassword-error" />
                    </div>
                    <p class="field-error mt-2" id="confirmPassword-error"></p>
                </div>

                <div class="mb-8">
                    <label for="acceptTerms" class="flex items-start gap-3 text-sm" style="color:#4A3B32; cursor:pointer; line-height:1.5">
                        <input type="checkbox" id="acceptTerms" style="width:18px; height:18px; margin-top:2px; accent-color:#4A3B32; flex:none" aria-describedby="acceptTerms-error" />
                        <span>I agree to the <a href="/pages/terms.html" target="_blank" rel="noopener" style="text-decoration:underline; text-underline-offset:2px">Terms &amp; Privacy Policy</a>, including how my details are stored.</span>
                    </label>
                    <p class="field-error mt-2" id="acceptTerms-error"></p>
                </div>

                <button type="submit" class="btn-primary w-full mb-5" id="register-btn">Create account</button>
            </form>

            <p class="text-sm text-center" style="color:#7a654b;">
                Already a member?
                <a id="signin-link" href="./Login.html" style="color:#4A3B32; text-decoration:underline; text-underline-offset:2px;">Sign in</a>
            </p>
        </div>
    </main>

    <footer id="footer"></footer>
</body>
</html>
