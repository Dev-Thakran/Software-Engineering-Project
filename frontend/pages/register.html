<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Create Account – La Extravaganza</title>
		<script src="https://cdn.tailwindcss.com"></script>
		<script src="../js/header.js"></script>
		<script src="../js/footer.js"></script>
		<script src="../js/register.js"></script>

		<link
			href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap"
			rel="stylesheet" />
		<style>
			body {
				font-family: "DM Sans", sans-serif;
				background: #f5f0e8;
				color: #1a1a1a;
				margin: 0;
			}
			.serif {
				font-family: "Cormorant Garamond", serif;
			}

			/* CARD */
			.card {
				background: white;
				max-width: 440px;
				margin: 0 auto;
				padding: 44px 48px;
				box-shadow: 0 4px 32px rgba(0, 0, 0, 0.08);
			}

			/* INPUTS */
			.input-line {
				width: 100%;
				border: none;
				border-bottom: 1px solid #ccc;
				background: transparent;
				padding: 10px 0;
				font-size: 13px;
				font-family: "DM Sans", sans-serif;
				outline: none;
				color: #111;
				transition: border-color 0.2s;
				box-sizing: border-box;
			}
			.input-line:focus {
				border-bottom-color: #1c1c1c;
			}
			.input-line::placeholder {
				color: #bbb;
			}

			/* BUTTON */
			.btn-create {
				width: 100%;
				background: #1c1c1c;
				color: #fff;
				padding: 15px;
				font-size: 11px;
				font-weight: 600;
				letter-spacing: 0.15em;
				text-transform: uppercase;
				border: none;
				cursor: pointer;
				transition: opacity 0.2s;
			}
			.btn-create:hover {
				opacity: 0.85;
			}

			/* ERROR / SUCCESS */
			.error-msg {
				background: #fee2e2;
				color: #991b1b;
				padding: 10px 14px;
				font-size: 12px;
				border-radius: 2px;
				display: none;
				margin-bottom: 12px;
			}
			.success-msg {
				background: #dcfce7;
				color: #166534;
				padding: 10px 14px;
				font-size: 12px;
				border-radius: 2px;
				display: none;
				margin-bottom: 12px;
			}
		</style>
	</head>
	<body>
		
		<header id="header"></header>

		<!-- MAIN -->
		<main class="px-6 py-16">
			<div class="card">
				<p class="text-xs uppercase tracking-widest text-gray-400 mb-2">
					Create Account
				</p>
				<h1
					class="serif text-4xl font-semibold text-[#1c1c1c] mb-8"
					style="line-height: 1.15">
					Begin your stay.
				</h1>

				<!-- Messages -->
				<div class="error-msg" id="errorMsg"></div>
				<div class="success-msg" id="successMsg"></div>

				<!-- Full Name -->
				<div class="mb-7">
					<label
						class="block text-xs uppercase tracking-widest text-gray-400 mb-2">
						Full Name
					</label>
					<input type="text" id="fullName" class="input-line" placeholder="" />
				</div>

				<!-- Email -->
				<div class="mb-7">
					<label
						class="block text-xs uppercase tracking-widest text-gray-400 mb-2">
						Email
					</label>
					<input type="email" id="email" class="input-line" placeholder="" />
				</div>

				<!-- Password -->
				<div class="mb-7">
					<label
						class="block text-xs uppercase tracking-widest text-gray-400 mb-2">
						Password
					</label>
					<input
						type="password"
						id="password"
						class="input-line"
						placeholder="" />
				</div>

				<!-- Confirm Password -->
				<div class="mb-10">
					<label
						class="block text-xs uppercase tracking-widest text-gray-400 mb-2">
						Confirm Password
					</label>
					<input
						type="password"
						id="confirmPassword"
						class="input-line"
						placeholder="" />
				</div>

				<!-- Submit -->
				<button class="btn-create mb-5" onclick="handleRegister()">
					Create Account
				</button>

				<p class="text-xs text-gray-400 text-center">
					Already a member?
					<a
						href="./Login.html"
						class="text-[#1c1c1c] underline underline-offset-2">
						Sign in
					</a>
				</p>
			</div>
		</main>

		<!-- FOOTER -->
		<footer id="footer">
		</footer>
	</body>
</html>
