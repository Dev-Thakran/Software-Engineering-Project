<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>My Stays – La Extravaganza</title>
		<link rel="stylesheet" href="../css/main.css" />
		<link rel="icon" href="/images/favicon.svg" type="image/svg+xml" />
		<meta name="description" content="Your upcoming and past stays at La Extravaganza." />
		<script src="../js/ui.js"></script>
		<script src="../js/header.js"></script>
		<script src="../js/footer.js"></script>
		<script src="../js/mybooking.js" defer></script>
		<style>
			.stay-hero { display: grid; grid-template-columns: 1.1fr 1fr; background: #fff; border: 1px solid var(--lux-brown-100); overflow: hidden; }
			.stay-hero-photo { position: relative; min-height: 320px; background: #efe8df; }
			.stay-hero-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
			.countdown { position: absolute; left: 20px; bottom: 20px; background: rgba(26, 20, 15, 0.82); color: #faf7f2; padding: 10px 16px; font-size: 13px; letter-spacing: 0.06em; }
			.countdown strong { font-family: "Cormorant Garamond", serif; font-size: 24px; font-weight: 400; margin-right: 6px; }
			@media (max-width: 860px) { .stay-hero { grid-template-columns: 1fr; } .stay-hero-photo { min-height: 220px; } }

			.booking-card { display: flex; flex-direction: column; background: #fff; border: 1px solid var(--lux-brown-100); }
			.booking-card-body { padding: 22px 24px; display: flex; flex-direction: column; flex: 1; }
			.booking-row { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--lux-brown-100); font-size: 14px; }
			.booking-row:last-of-type { border-bottom: none; }
			.booking-row span:first-child { color: var(--lux-text-soft); }
			.booking-row span:last-child { color: var(--lux-brown-800); text-align: right; }
			.card-actions { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: auto; padding-top: 16px; }
			.text-action { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; background: none; border: none; padding: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--lux-brown-700); cursor: pointer; text-decoration: none; }
			.text-action:hover { color: var(--lux-brown-900); text-decoration: underline; text-underline-offset: 4px; }
			.text-action.danger { color: var(--lux-danger); }

			.status-badge { font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; padding: 5px 10px; white-space: nowrap; }
			.status-badge.booked { background: #eaf3ec; color: #2f5e3b; }
			.status-badge.today { background: #2c241b; color: #faf7f2; }
			.status-badge.staying { background: #c9a961; color: #2c241b; }
			.status-badge.done { background: var(--lux-cream-dark); color: var(--lux-brown-700); }
			.status-badge.cancelled { background: #fbf0ee; color: var(--lux-danger); }

			/* Star picker in the review dialog */
			.star-picker { display: flex; gap: 4px; }
			.star-picker label { font-size: 32px; line-height: 1; color: #d9cbb9; cursor: pointer; transition: color 0.15s, transform 0.15s; }
			.star-picker input { position: absolute; opacity: 0; width: 1px; height: 1px; }
			.star-picker label.lit { color: var(--lux-gold); }
			.star-picker input:focus-visible + label { outline: 2px solid var(--lux-focus); outline-offset: 2px; }
			.ui-dialog textarea, .ui-dialog input[type="text"] { width: 100%; border: 1px solid var(--lux-brown-200); padding: 10px 12px; font-size: 15px; background: #fff; }
			.ui-dialog textarea { min-height: 110px; resize: vertical; }
		</style>
		<!-- Built by npm run build:css; last in <head> to keep the same cascade as the old Tailwind CDN -->
		<link rel="stylesheet" href="/css/tailwind.css" />
	</head>
	<body style="background: var(--lux-cream)">
		<header class="sticky top-0 z-20" id="header"></header>

		<main class="mx-auto px-4 md:px-12 py-14 pb-24" style="max-width: 1120px">
			<p class="kicker mb-3" id="welcome-kicker">Welcome back</p>
			<div class="flex flex-wrap items-end justify-between gap-4 mb-10">
				<h1 class="font-serif" style="font-size: clamp(44px, 7vw, 64px); color: var(--lux-brown-800); line-height: 1.05">My stays</h1>
				<a href="./browserooms.html" class="btn-secondary">Book another stay</a>
			</div>

			<!-- mybooking.js fills these in -->
			<section id="next-stay" class="mb-14" aria-label="Your next stay" aria-busy="true">
				<div class="skeleton" style="height: 320px"></div>
			</section>

			<section id="upcoming-section" class="mb-14" hidden>
				<h2 class="font-serif mb-6" style="font-size: 32px; color: var(--lux-brown-800)">Also coming up</h2>
				<div id="upcoming-grid" class="grid grid-cols-1 md:grid-cols-2 gap-5"></div>
			</section>

			<section class="mb-14">
				<h2 class="font-serif mb-6" style="font-size: 32px; color: var(--lux-brown-800)">Past stays</h2>
				<div id="past-grid" class="grid grid-cols-1 md:grid-cols-2 gap-5">
					<div class="skeleton" style="height: 220px"></div>
					<div class="skeleton" style="height: 220px"></div>
				</div>
			</section>

			<details id="cancelled-section" hidden>
				<summary class="kicker" style="cursor: pointer; padding: 8px 0">Cancelled bookings (<span id="cancelled-count">0</span>)</summary>
				<div id="cancelled-grid" class="grid grid-cols-1 md:grid-cols-2 gap-5 mt-4"></div>
			</details>
		</main>

		<footer id="footer"></footer>
	</body>
</html>
