<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Choose a New Password – La Extravaganza</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<link rel="stylesheet" href="../css/main.css" />
	<link rel="icon" href="/images/favicon.svg" type="image/svg+xml" />
	<meta name="description" content="Choose a new password for your La Extravaganza account." />
	<script src="../js/ui.js"></script>
	<script src="../js/header.js"></script>
	<script src="../js/footer.js"></script>
	<script src="../js/reset.js" defer></script>
</head>
<body>
	<header class="sticky top-0 z-20" id="header"></header>

	<main class="px-4 py-16">
		<div class="card" style="max-width: 460px; margin: 0 auto; padding: 44px clamp(24px, 6vw, 48px)">
			<p class="kicker mb-2">Account help</p>
			<h1 class="font-serif text-4xl mb-2" style="color: #2c241b">Choose a new password</h1>
			<p class="text-sm mb-8" style="color: var(--lux-text-muted)">Your new password replaces the old one straight away.</p>

			<form id="reset-form" novalidate>
				<div class="error-msg" id="errorMsg" role="alert"></div>
				<div class="mb-7">
					<label class="input-label" for="password">New password</label>
					<div class="password-wrap">
						<input type="password" id="password" class="input-line" autocomplete="new-password" aria-describedby="strength-text password-error" />
					</div>
					<div class="strength" id="strength" data-level="0" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
					<p class="field-hint mt-2" id="strength-text">At least 8 characters.</p>
					<p class="field-error mt-1" id="password-error"></p>
				</div>
				<div class="mb-10">
					<label class="input-label" for="confirmPassword">Confirm new password</label>
					<div class="password-wrap">
						<input type="password" id="confirmPassword" class="input-line" autocomplete="new-password" aria-describedby="confirmPassword-error" />
					</div>
					<p class="field-error mt-2" id="confirmPassword-error"></p>
				</div>
				<button type="submit" class="btn-primary w-full mb-5" id="reset-btn">Save new password</button>
			</form>

			<p class="text-sm text-center" style="color: #7a654b">
				Link not working?
				<a href="/pages/forgot.html" style="color: #4a3b32; text-decoration: underline; text-underline-offset: 2px">Request a new one</a>
			</p>
		</div>
	</main>

	<footer id="footer"></footer>
</body>
</html>
