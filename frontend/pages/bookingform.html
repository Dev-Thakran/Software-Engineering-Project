<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Booking Form - La Extravaganza</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/main.css"/>
    <script src="../js/header.js"></script>
    <script src="../js/footer.js"></script>
</head>


<body>
    <header id="header"></header>

    <section bg-[#FAF7F2]>
        <p class="uppercase tracking-[0.2em] text-xs text-[#928065] mb-4 pt-16 pl-9">
            Reservation
        </p>

        <p class="font-serif text-4xl text-[#2C241B] mb-4 pl-9 italic">
            Secure your stay
        </p>

        <div class="max-w-7xl w-full grid grid-cols-1 lg:grid-cols-3 gap-6 pl-16 py-4">
            <div>
                <button class="text-[#4A3B32] text-lg" id="infobtn">1 — Dates & Guests</button>
                <hr class="border-t-2 border-[#4A3B32] my-3" id="infolne">
            </div>
            <div>
                <button class="text-[#4A3B32] text-lg" id="paybtn">2 — Payment</button>
                <hr class="border-t-2 border-[#4A3B32] my-3" id="paylne">
            </div>
        </div>
        <hr class="border-t border-[#4A3B32] my-3">
    </section>

    <!--Dates & Guests slide-->
    <section class="py-4 " id="info-slide">
        <div class="py-4">
            <div class="max-w-7xl mx-auto w-auto grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="lg:col-span-2 bg-[#FFFFFF]">
                    <div class="grid grid-cols-2 gap-4 py-4">
                        <div class="h-12 pl-2">
                            <label for="checkin">Check-In</label><br>
                            <input type="date" id="checkin" class="w-[200px]"> 
                            <hr class="border-t border-[#4A3B32] my-3">
                        </div>
                        <div class="h-12">
                            <label for="checkout">Check Out</label><br>
                            <input type="date" id="checkout" class="w-[200px]">
                            <hr class="border-t border-[#4A3B32] my-3">
                        </div>
                    </div>

                    <div class="w-full py-4 pl-2">
                        <label for="guestinput">Guests (Max -)</label><br>
                        <input type="text" id="guestinput" class="w-[500px]">
                        <hr class="border-t border-[#4A3B32] my-3">
                    </div>

                    <div class="pl-2 pt-2 pb-4">
                        <button type="button" class="bg-[#4A3B32] uppercase tracking-[0.2em] text-xs hover:bg-[#342A24] transition text-[white] py-4 px-4" id="continuepaybtn">Continue to payment</button>
                    </div>
                </div>

                <!--Summary-->
                <div class="lg:col-span-1 bg-[white] p-6" >
                    <div class="overflow-hidden w-full py-4">
                        <img src="#" alt="#" class="w-full h-auto object-cover"/>
                    </div>

                    <div class="mt-6 space-y-5 text-[#2C241B]">
                        <div>
                            <p class="uppercase tracking-[0.3em] text-3xl text-[#9A7355]" id="room-floor">-</p>
                            <h2 class="font-serif text-xs mt-2" id="room-id">-</h2>
                        </div>
                    </div>
                    
                    <hr class="border-t border-[#4A3B32] my-3">
                    <div class="space-y-3 pb-3">
                        <div class="flex justify-between ">
                            <span>Check-in</span>
                            <span id="checkin-input">-</span>
                        </div>
                        <div class="flex justify-between ">
                            <span>Check-out</span>
                            <span id="checkout-input">-</span>
                        </div>
                        <div class="flex justify-between  ">
                            <span>Guests</span>
                            <span id="guest-input">-</span>
                        </div>
                        <div class="flex justify-between ">
                            <span>Nights</span>
                            <span id="checkdate-sum">-</span>
                        </div>
                    </div>
                    <hr class="border-t border-[#4A3B32] my-3">

                    <div class="space-y-3">
                        <div class="flex justify-between">
                            <span><span id="price">$-</span> x <span id="nightsdisplay">-</span></span>
                            <span id="subtotal">$-</span>
                        </div>

                        <div class="flex justify-between">
                            <span>Taxes & fees</span>
                            <span>$30</span>
                        </div>
                    </div>

                    <hr class="border-t border-[#4A3B32] my-3">
                    <div class="pt-4 flex justify-between items-end">
                        <span class="uppercase tracking-[0.3em] text-xs text-[#928065]">Total</span>
                        <span class="text-3xl font-semibold" id="total">-</span>
                    </div>
                    
                </div>
            </div>
        </div>
    </section>


    <!--Payment slide-->
    <section class="py-4 hidden" id="pay-slide">
        <div class="py-4">
            <div class="max-w-7xl mx-auto w-auto grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="lg:col-span-2 bg-[#FFFFFF] pl-6">

                    <div class="grid grid-cols-2 lg:grid-cols-2 gap-4 py-2 w-[1100px]">
                        <p class="text-lg pl-8">Secure Mock Payment</p> <br>

                        <div class="grid grid-cols-2 lg:grid-cols-2 gap-4 py-2 bg-[#221B14] text-[#FAF7E5] px-8 uppercase text-sm">
                            <div class="lg:col-span-2 py-4">
                                <p>LuxStay Pay</p>
                            </div>
                            <div class="lg:col-span-2 py-8">
                                <p id="cardno-dis">4242 4242 42424 4242</p>
                            </div>
                            <div class="lg:col-span-1 py-4">
                                <p id="cardname-dis">Name on card</p>
                            </div>
                            <div class="lg:col-span-1 py-4">
                                <p id="cardexp-dis">MM/YY</p>
                            </div>
                            
                        </div>
                    </div>

                    <hr class="border-t border-[#4A3B32] my-3">
                    <div class="w-full py-4 pl-2">
                        <label for="cardname">Name on Card</label><br>
                        <input type="text" id="cardname" class="w-[500px]">
                        <hr class="border-t border-[#4A3B32] my-3">
                    </div>

                    <div class="w-full py-4 pl-2">
                        <label for="cardno">Card Number</label><br>
                        <input type="text" id="cardno" class="w-[500px]">
                        <hr class="border-t border-[#4A3B32] my-3">
                    </div>

                    <div class="grid grid-cols-2 lg:grid-cols-2 gap-4">
                        <div class="lg:col-span-1 py-4">
                            <label for="cardexp">MM/YY</label><br>
                            <input type="text" id="cardexp" class="w-[400px]">
                            <hr class="border-t border-[#4A3B32] my-3">
                        </div>
                        <div class="lg:col-span-1 py-4">
                            <label for="cardcvv">CVV</label><br>
                            <input type="text" id="cardcvv" class="w-[400px]">
                            <hr class="border-t border-[#4A3B32] my-3">
                        </div>
                    </div>
                    
                    <div class="flex pt-2 pb-4 justify-center">
                        <button type="button" class="bg-[#4A3B32] uppercase tracking-[0.2em] text-xs hover:bg-[#342A24] transition text-[white] py-4 px-4 w-[750px]">Pay $-</button>
                    </div>
                </div>

                <!--Mirrored Summary-->
                <div class="lg:col-span-1 bg-[white] p-6" >
                    <div class="overflow-hidden w-full py-4">
                        <img src="#" alt="#" class="w-full h-auto object-cover"/>
                    </div>

                    <div class="mt-6 space-y-5 text-[#2C241B]">
                        <div>
                            <p class="uppercase tracking-[0.3em] text-3xl text-[#9A7355]" id="room-floor">-</p>
                            <h2 class="font-serif text-xs mt-2" id="room-id">-</h2>
                        </div>
                    </div>
                    
                    <hr class="border-t border-[#4A3B32] my-3">
                    <div class="space-y-3 pb-3">
                        <div class="flex justify-between ">
                            <span>Check-in</span>
                            <span id="checkin-input2">-</span>
                        </div>
                        <div class="flex justify-between ">
                            <span>Check-out</span>
                            <span id="checkout-input2">-</span>
                        </div>
                        <div class="flex justify-between  ">
                            <span>Guests</span>
                            <span id="guest-input2">-</span>
                        </div>
                        <div class="flex justify-between ">
                            <span>Nights</span>
                            <span id="checkdate-sum2">-</span>
                        </div>
                    </div>
                    <hr class="border-t border-[#4A3B32] my-3">

                    <div class="space-y-3">
                        <div class="flex justify-between">
                            <span><span id="price2">$-</span> x <span id="nightsdisplay2">-</span></span>
                            <span id="subtotal2">$-</span>
                        </div>

                        <div class="flex justify-between">
                            <span>Taxes & fees</span>
                            <span>$30</span>
                        </div>
                    </div>

                    <hr class="border-t border-[#4A3B32] my-3">
                    <div class="pt-4 flex justify-between items-end">
                        <span class="uppercase tracking-[0.3em] text-xs text-[#928065]">Total</span>
                        <span class="text-3xl font-semibold" id="total2">-</span>
                    </div>
                    
                </div>
            </div>
        </div>

    </section>

    <footer id="footer"></footer>

    <script src="../js/booking.js"></script>
</body>
</html>
