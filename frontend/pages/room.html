<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Room – La Extravaganza</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/main.css" />
    <script src="../js/header.js"></script>
    <script src="../js/footer.js"></script>
    <script src="../js/room.js" defer></script>
    <style>
        .amenity-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 0;
            border-bottom: 1px solid var(--lux-brown-100);
            font-family: 'Outfit', sans-serif;
            font-size: 13px;
            color: var(--lux-brown-700);
        }
        .amenity-check {
            color: var(--lux-brown-700);
            font-size: 14px;
            flex-shrink: 0;
        }
        .review-item {
            padding: 20px 0;
            border-bottom: 1px solid var(--lux-brown-100);
        }
        .review-item:last-child { border-bottom: none; }
    </style>
</head>
<body>
    <header id="header"></header>

    <main style="background:var(--lux-cream);">

        <!-- Back link -->
        <div style="padding:20px 48px 0; max-width:1200px; margin:0 auto;">
            <a href="./rooms.html"
               style="font-family:'Outfit',sans-serif; font-size:11px;
                      letter-spacing:0.22em; text-transform:uppercase;
                      color:var(--lux-brown-500); text-decoration:none;">
                ← Back to Rooms
            </a>
        </div>

        <!-- Hero split -->
        <div style="display:grid; grid-template-columns:1fr 1fr;
                    max-width:1200px; margin:24px auto 0; padding:0 48px; gap:64px; align-items:start;">

            <!-- Left image -->
            <div style="overflow:hidden;">
                <img id="room-image" src="" alt="Room"
                     style="width:100%; height:480px; object-fit:cover; display:block;" />
            </div>

            <!-- Right details -->
            <div style="padding-top:8px;">
                <p id="room-floor-label" class="kicker mb-3"></p>

                <h1 id="room-name" class="font-serif"
                    style="font-size:64px; color:var(--lux-brown-800);
                           font-weight:400; line-height:1.05; margin-bottom:24px;"></h1>

                <div style="border-top:1px solid var(--lux-brown-100); margin-bottom:20px;"></div>

                <div class="flex gap-8 mb-6" style="color:var(--lux-brown-500);">
                    <p id="room-guests" style="font-family:'Outfit',sans-serif; font-size:13px;"></p>
                    <p id="room-sqm"    style="font-family:'Outfit',sans-serif; font-size:13px;"></p>
                </div>

                <div style="border-top:1px solid var(--lux-brown-100); margin-bottom:20px;"></div>

                <p id="room-description"
                   style="font-family:'Outfit',sans-serif; font-size:14px;
                          color:var(--lux-brown-600); line-height:1.8; margin-bottom:32px;"></p>

                <div class="flex items-baseline gap-3 mb-8">
                    <p id="room-price" class="font-serif"
                       style="font-size:52px; color:var(--lux-brown-800); line-height:1;"></p>
                    <p style="font-family:'Outfit',sans-serif; font-size:13px;
                              color:var(--lux-brown-500);">per night</p>
                </div>

                <a id="reserve-btn" href="#"
                   style="display:block; width:100%; background:var(--lux-brown-800);
                          color:var(--lux-cream); font-family:'Outfit',sans-serif;
                          font-size:11px; font-weight:600; letter-spacing:0.22em;
                          text-transform:uppercase; padding:18px; text-align:center;
                          text-decoration:none; transition:background 0.3s;">
                    Reserve This Room
                </a>
            </div>
        </div>

        <!-- Amenities + Reviews -->
        <div style="display:grid; grid-template-columns:1fr 1fr;
                    max-width:1200px; margin:80px auto 96px; padding:0 48px; gap:80px;">

            <div>
                <p class="kicker mb-3">Amenities</p>
                <h2 class="font-serif text-4xl font-normal mb-8" style="color:var(--lux-brown-800);">
                    Every detail, considered.
                </h2>
                <div id="amenities-grid"
                     style="display:grid; grid-template-columns:1fr 1fr; gap:0 40px;">
                </div>
            </div>

            <div>
                <p class="kicker mb-3">Guest Voices</p>
                <h2 class="font-serif text-4xl font-normal mb-8" style="color:var(--lux-brown-800);">
                    What others have said.
                </h2>
                <div id="reviews-list"></div>
            </div>
        </div>

    </main>

    <footer id="footer"></footer>
</body>
</html>
