<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact – La Extravaganza</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/main.css" />
    <style>
      textarea.input-line {
        resize: vertical;
        min-height: 120px;
        border: 1px solid #d4c4b0;
        padding: 12px;
        line-height: 1.6;
      }
      textarea.input-line:focus {
        border-color: #4a3b32;
      }
      .info-card {
        background: #2c241b;
        padding: 36px;
      }
      .info-icon {
        width: 32px;
        height: 32px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        flex-shrink: 0;
        margin-top: 2px;
      }
      #map {
        width: 100%;
        height: 220px;
        border: 1px solid #e6dfd7;
      }
      .success-toast {
        display: none;
        background: #f0fdf4;
        color: #166534;
        border: 1px solid #bbf7d0;
        padding: 12px 16px;
        font-family: "Outfit", sans-serif;
        font-size: 13px;
        margin-top: 12px;
      }
    </style>
    <script src="../js/header.js"></script>
    <script src="../js/footer.js"></script>
  </head>
  <body>
    <header id="header"></header>

    <section>
        <!-- PAGE HEADER -->
    <div style="padding: 80px 48px 48px; background: #faf7f2">
      <div class="container">
        <p class="kicker mb-3">Get in Touch</p>
        <h1
          class="font-serif"
          style="
            font-size: clamp(36px, 5vw, 64px);
            color: #2c241b;
            font-weight: 400;
            line-height: 1.1;
          "
        >
          Our concierge awaits.
        </h1>
      </div>
    </div>

    <!-- MAIN CONTENT -->
    <div style="padding: 0 48px 96px; background: #faf7f2">
      <div class="container">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <!-- LEFT: CONTACT FORM -->
          <div
            style="border: 1px solid #e6dfd7; background: #fff; padding: 40px"
          >
            <div class="mb-7">
              <label class="input-label">Name</label>
              <input type="text" id="contactName" class="input-line" />
            </div>

            <div class="mb-7">
              <label class="input-label">Email</label>
              <input type="email" id="contactEmail" class="input-line" />
            </div>

            <div class="mb-8">
              <label class="input-label">Message</label>
              <textarea
                id="contactMessage"
                class="input-line w-full"
              ></textarea>
            </div>

            <div class="error-msg" id="errorMsg"></div>
            <div class="success-toast" id="successToast">
              ✓ Your enquiry has been sent. We'll be in touch shortly.
            </div>

            <button
              class="btn-primary mt-2"
              onclick="handleEnquiry()"
              style="padding: 14px 28px; font-size: 11px"
            >
              Send Enquiry
            </button>
          </div>

          <!-- RIGHT: INFO + MAP -->
          <div class="flex flex-col gap-0">
            <!-- Dark info card -->
            <div class="info-card">
              <h2
                class="font-serif text-white mb-8"
                style="font-size: 28px; font-weight: 400"
              >
                Visit us.
              </h2>

              <div class="flex gap-4 mb-6">
                <div class="info-icon" style="color: rgba(255, 255, 255, 0.6)">
                  📍
                </div>
                <div>
                  <p
                    class="kicker mb-1"
                    style="color: rgba(255, 255, 255, 0.45); font-size: 9px"
                  >
                    Address
                  </p>
                  <p
                    class="font-sans"
                    style="
                      font-size: 13px;
                      color: rgba(255, 255, 255, 0.75);
                      line-height: 1.7;
                    "
                  >
                    42 Harbour Avenue<br />Auckland Central, 1010<br />New
                    Zealand
                  </p>
                </div>
              </div>

              <div class="flex gap-4 mb-6">
                <div class="info-icon" style="color: rgba(255, 255, 255, 0.6)">
                  📞
                </div>
                <div>
                  <p
                    class="kicker mb-1"
                    style="color: rgba(255, 255, 255, 0.45); font-size: 9px"
                  >
                    Telephone
                  </p>
                  <p
                    class="font-sans"
                    style="font-size: 13px; color: rgba(255, 255, 255, 0.75)"
                  >
                    +64 9 123 4567
                  </p>
                </div>
              </div>

              <div class="flex gap-4">
                <div class="info-icon" style="color: rgba(255, 255, 255, 0.6)">
                  ✉️
                </div>
                <div>
                  <p
                    class="kicker mb-1"
                    style="color: rgba(255, 255, 255, 0.45); font-size: 9px"
                  >
                    Email
                  </p>
                  <p
                    class="font-sans"
                    style="font-size: 13px; color: rgba(255, 255, 255, 0.75)"
                  >
                    reservations@laextravaganza.co.nz
                  </p>
                </div>
              </div>
            </div>

            <!-- Google Map -->
            <div id="map"></div>
          </div>
        </div>
      </div>
    </div>

    </section>
    <footer id="footer"></footer>

    <!-- Google Maps -->
    <script>
      function initMap() {
        const location = { lat: -36.8485, lng: 174.7633 };

        const map = new google.maps.Map(document.getElementById("map"), {
          zoom: 15,
          center: location,
          disableDefaultUI: false,
          zoomControl: true,
        });

        // Custom marker
        new google.maps.Marker({
          position: location,
          map,
          title: "La Extravaganza",
          icon: {
            path: google.maps.SymbolPath.CIRCLE,
            scale: 8,
            fillColor: "#2C241B",
            fillOpacity: 1,
            strokeColor: "#FAF7F2",
            strokeWeight: 2,
          },
        });
      }

      // ── FORM ──
      function handleEnquiry() {
        const name = document.getElementById("contactName").value.trim();
        const email = document.getElementById("contactEmail").value.trim();
        const message = document.getElementById("contactMessage").value.trim();
        const err = document.getElementById("errorMsg");
        const success = document.getElementById("successToast");

        err.style.display = "none";

        if (!name) {
          showError("Please enter your name.");
          return;
        }
        if (!email) {
          showError("Please enter your email.");
          return;
        }
        if (!email.includes("@")) {
          showError("Please enter a valid email.");
          return;
        }
        if (!message) {
          showError("Please enter a message.");
          return;
        }

        success.style.display = "block";
        document.getElementById("contactName").value = "";
        document.getElementById("contactEmail").value = "";
        document.getElementById("contactMessage").value = "";
        setTimeout(() => (success.style.display = "none"), 5000);
      }

      function showError(msg) {
        const el = document.getElementById("errorMsg");
        el.textContent = msg;
        el.style.display = "block";
        setTimeout(() => (el.style.display = "none"), 4000);
      }
    </script>
    <script
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD98fnnlMqF1gW6OUILd6DNY9St57eYtmU&callback=initMap"
      async
      defer
    ></script>
  </body>
</html>
