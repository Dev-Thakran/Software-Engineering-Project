<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LA Extravagenza Browse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Outfit:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      .font-cormorant {
        font-family: "Cormorant Garamond", serif;
      }
      body {
        font-family: "Outfit", sans-serif;
      }
    </style>
  </head>
  <body class="bg-[#FAF7F2]">
    <div id="root"></div>

    <script type="text/babel">
      // ─── ADD / EDIT ROOMS HERE ───────────────────────────────────────────────
      const rooms = [
        {
          id: 1,
          floor: 1,
          type: "Garden",
          name: "Room 101",
          price: 180,
          bed: "Queen",
          guests: 2,
          size: 34,
          img: "https://images.unsplash.com/photo-1631049307264-da0ec9d70304?w=800&q=80",
        },
        {
          id: 2,
          floor: 1,
          type: "Garden",
          name: "Room 102",
          price: 200,
          bed: "Queen",
          guests: 2,
          size: 36,
          img: "https://images.unsplash.com/photo-1618773928121-c32242e63f39?w=800&q=80",
        },
        {
          id: 3,
          floor: 1,
          type: "Garden",
          name: "Room 103",
          price: 220,
          bed: "Queen",
          guests: 2,
          size: 38,
          img: "https://images.unsplash.com/photo-1591088398332-8a7791972843?w=800&q=80",
        },
        {
          id: 4,
          floor: 2,
          type: "Classic",
          name: "Room 201",
          price: 280,
          bed: "King",
          guests: 3,
          size: 42,
          img: "https://images.unsplash.com/photo-1566665797739-1674de7a421a?w=800&q=80",
        },
        {
          id: 5,
          floor: 2,
          type: "Classic",
          name: "Room 202",
          price: 300,
          bed: "King",
          guests: 2,
          size: 45,
          img: "https://images.unsplash.com/photo-1578683010236-d716f9a3f461?w=800&q=80",
        },
        {
          id: 6,
          floor: 3,
          type: "Suite",
          name: "Suite 301",
          price: 520,
          bed: "King",
          guests: 4,
          size: 72,
          img: "https://images.unsplash.com/photo-1560185893-a55cbc8c57e8?w=800&q=80",
        },
      ];
      // ─────────────────────────────────────────────────────────────────────────

      const BedIcon = () => (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          className="w-4 h-4"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          strokeWidth="1.5"
        >
          <path
            strokeLinecap="round"
            strokeLinejoin="round"
            d="M3 12h18M3 12V8a2 2 0 012-2h14a2 2 0 012 2v4M3 12v4h18v-4"
          />
        </svg>
      );

      const GuestIcon = () => (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          className="w-4 h-4"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          strokeWidth="1.5"
        >
          <path
            strokeLinecap="round"
            strokeLinejoin="round"
            d="M17 20H7m0 0a3 3 0 110-6h10a3 3 0 110 6zM12 4a4 4 0 100 8 4 4 0 000-8z"
          />
        </svg>
      );

      const SizeIcon = () => (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          className="w-4 h-4"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          strokeWidth="1.5"
        >
          <rect
            x="3"
            y="3"
            width="18"
            height="18"
            rx="1"
            strokeLinecap="round"
            strokeLinejoin="round"
          />
          <path strokeLinecap="round" d="M3 9h18M9 21V9" />
        </svg>
      );

      function RoomCard({ room }) {
        const [hovered, setHovered] = React.useState(false);

        return (
          <div
            className="bg-white overflow-hidden cursor-pointer"
            onMouseEnter={() => setHovered(true)}
            onMouseLeave={() => setHovered(false)}
          >
            {/* Photo */}
            <div className="relative overflow-hidden aspect-[4/3]">
              <img
                src={room.img}
                alt={room.name}
                className="w-full h-full object-cover"
                style={{
                  transition: "transform 0.5s ease",
                  transform: hovered ? "scale(1.04)" : "scale(1)",
                }}
              />
              <span className="absolute top-4 left-4 bg-white/90 text-[#4A3B32] text-[10px] tracking-[0.2em] uppercase font-medium px-3 py-1.5">
                Floor {room.floor}
              </span>
            </div>

            {/* Info */}
            <div className="px-5 pt-5 pb-4">
              <div className="flex items-start justify-between">
                <div>
                  <p className="text-[10px] tracking-[0.2em] text-[#8B7355] uppercase mb-1">
                    {room.type}
                  </p>
                  <h3 className="font-cormorant text-3xl text-[#4A3B32] font-light leading-none">
                    {room.name}
                  </h3>
                </div>
                <div className="text-right">
                  <p className="font-cormorant text-3xl text-[#4A3B32] font-light">
                    ${room.price}
                  </p>
                  <p className="text-[11px] text-[#8B7355]">per night</p>
                </div>
              </div>

              <hr className="border-[#E5DDD2] my-4" />

              <div className="flex gap-5 text-[#8B7355] text-xs">
                <span className="flex items-center gap-1.5">
                  <BedIcon /> {room.bed}
                </span>
                <span className="flex items-center gap-1.5">
                  <GuestIcon /> {room.guests}
                </span>
                <span className="flex items-center gap-1.5">
                  <SizeIcon /> {room.size}m²
                </span>
              </div>
            </div>
          </div>
        );
      }

      function App() {
        const [maxPrice, setMaxPrice] = React.useState(2000);
        const [floorFilter, setFloorFilter] = React.useState("All");
        const [sort, setSort] = React.useState("asc");

        const floors = [
          "All",
          ...Array.from(new Set(rooms.map((r) => r.floor))).sort(),
        ];

        const filtered = rooms
          .filter((r) => r.price <= maxPrice)
          .filter(
            (r) => floorFilter === "All" || r.floor === Number(floorFilter),
          )
          .sort((a, b) =>
            sort === "asc" ? a.floor - b.floor : b.floor - a.floor,
          );

        return (
          <div className="bg-[#FAF7F2] min-h-screen">
            {/* Header */}
            <header className="px-10 pt-10 pb-4">
              <p className="text-[11px] tracking-[0.25em] text-[#8B7355] uppercase mb-2">
                The Collection
              </p>
              <h2 className="font-cormorant text-5xl text-[#4A3B32] font-light">
                Rooms &amp; Suites
              </h2>
              <p className="text-sm text-[#8B7355] mt-3 max-w-lg leading-relaxed">
                Forty-eight sanctuaries across eight floors. Each tier a
                distinct promise — from garden calm to penthouse grandeur.
              </p>
            </header>

            {/* Filter Bar */}
            <section className="bg-[#F8F6F2] border border-[#E5DDD2] mx-10 mt-8 px-6 py-6">
              <div className="grid grid-cols-4 gap-6 items-end">
                <div>
                  <p className="text-[11px] tracking-[0.25em] text-[#8B7355] uppercase mb-2">
                    Floor
                  </p>
                  <select
                    className="w-full h-11 border border-[#D6C7B6] bg-white px-4 text-sm text-[#4A3B32] outline-none"
                    value={floorFilter}
                    onChange={(e) => setFloorFilter(e.target.value)}
                  >
                    {floors.map((f) => (
                      <option key={f} value={f}>
                        {f === "All" ? "All floors" : `Floor ${f}`}
                      </option>
                    ))}
                  </select>
                </div>

                <div>
                  <p className="text-[11px] tracking-[0.25em] text-[#8B7355] uppercase mb-2">
                    Max Price — ${maxPrice}/Night
                  </p>
                  <div className="h-11 flex items-center">
                    <input
                      type="range"
                      min="0"
                      max="2000"
                      value={maxPrice}
                      className="w-full accent-[#4A3B32]"
                      onChange={(e) => setMaxPrice(Number(e.target.value))}
                    />
                  </div>
                </div>

                <div>
                  <p className="text-[11px] tracking-[0.25em] text-[#8B7355] uppercase mb-2">
                    Sort
                  </p>
                  <select
                    className="w-full h-11 border border-[#D6C7B6] bg-white px-4 text-sm text-[#4A3B32] outline-none"
                    value={sort}
                    onChange={(e) => setSort(e.target.value)}
                  >
                    <option value="asc">Floor — low to high</option>
                    <option value="desc">Floor — high to low</option>
                  </select>
                </div>

                <div className="flex justify-end items-end">
                  <p className="text-[11px] tracking-[0.15em] text-[#8B7355] uppercase">
                    {filtered.length} room{filtered.length !== 1 ? "s" : ""}
                  </p>
                </div>
              </div>
            </section>

            {/* Cards Grid */}
            <section className="mx-10 mt-10 pb-16">
              {filtered.length === 0 ? (
                <p className="text-center text-[#8B7355] text-sm py-20 tracking-widest uppercase">
                  No rooms match your filters
                </p>
              ) : (
                <div className="grid grid-cols-3 gap-6">
                  {filtered.map((room) => (
                    <RoomCard key={room.id} room={room} />
                  ))}
                </div>
              )}
            </section>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
